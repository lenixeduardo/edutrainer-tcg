name: Import approved Shiny album hero asset
on:
  push:
    paths:
      - .github/workflows/import-approved-shiny-hero.yml
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow and requests
        run: python -m pip install --quiet Pillow requests
      - name: Retrieve original image and optimize
        env:
          SOURCE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F184ad05a-6cc4-4acc-8178-20301e2acdd2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOnV9gW0Ritb0jMTxGNxY5ePU5mqkagzwvaYf43TBDiP&exp=1794140235&osig=AAAAAAAAAAAAAAAAAAAAAM6b2s73a8qISgICPvlHRIXdnp6h9e6_3Xk4vIvQ4Qhn&signer=media-rpc&token=AAIAAU0AJDE4NGFkMDVhLTZjYzQtNGFjYy04MTc4LTIwMzAxZTJhY2RkMgAAAAABobsXZPjCJji4WUjnP8n0IkRcS-d7TRHF5xz-8Zvt7PBJGbjgfQ&x-canva-quality=thumbnail'
        run: |
          import os, io, sys, requests
          from PIL import Image
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          source=os.environ["SOURCE_URL"]
          original=urlsplit(source)
          def variant(path, drop=()):
              q=[(k,v) for k,v in parse_qsl(original.query,keep_blank_values=True) if k not in drop]
              return urlunsplit((original.scheme,original.netloc,path,urlencode(q),""))
          paths=[
           ("full signed",original.path.replace("height:112","height:941").replace("width:200","width:1672"),()),
           ("resized no csig",original.path.replace("height:112","height:941").replace("width:200","width:1672"),("csig",)),
           ("resized bare token",original.path.replace("height:112","height:941").replace("width:200","width:1672"),("csig","osig")),
           ("thumbnail original",original.path,()),
          ]
          found=None
          for label,path,drop in paths:
           try:
            resp=requests.get(variant(path,drop),timeout=20)
            print(label, "status=",resp.status_code,"bytes=",len(resp.content),flush=True)
            if not resp.ok:continue
            im=Image.open(io.BytesIO(resp.content)).convert("RGB")
            print("dimensions", im.size,flush=True)
            if im.width>=1100 and im.height>=600:
             found=im;break
           except Exception as exc:print(label,str(exc)[:170],flush=True)
          if found is None:sys.exit("No original-resolution signed image available; please do not substitute thumbnail.")
          os.makedirs("public/hero",exist_ok=True)
          found.save("public/hero/shiny-album-desktop.webp",format="WEBP",quality=78,method=6)
          w,h=found.size
          crop=found.crop((round(w*.344),round(h*.032),w,round(h*.935)))
          crop.save("public/hero/shiny-album-mobile.webp",format="WEBP",quality=79,method=6)
          print("Image assets written",found.size,crop.size,flush=True)
      - name: Commit image assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero/shiny-album-*.webp
          git commit -m "assets(hero): add approved Shiny collection photograph"
          git push origin HEAD:main
